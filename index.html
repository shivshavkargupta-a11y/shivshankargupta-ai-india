<script>
(function () {
  var now = new Date();
  var h24 = now.getHours();
  var greeting = h24 < 12 ? "Good morning" : (h24 < 17 ? "Good afternoon" : "Good evening");

  var h12 = h24 % 12; if (h12 === 0) h12 = 12;
  var mins = now.getMinutes();
  var minsText = mins < 10 ? "0" + mins : String(mins);
  var ampm = h24 < 12 ? "AM" : "PM";
  var timeText = h12 + ":" + minsText + " " + ampm;

  var hi = document.getElementById("hi");
  var clock = document.getElementById("clock");

  hi.textContent = greeting;
  hi.setAttribute("aria-label", timeText + ", " + greeting);
  clock.textContent = timeText;
})();
</script>
