<script>
(function () {
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  var greetEl = document.getElementById("greetLine");
  var dateEl  = document.getElementById("dateLine");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tick() {
    var now = new Date();
    var h24 = now.getHours();
    var greeting = h24 < 12 ? "Good morning" : (h24 < 17 ? "Good afternoon" : "Good evening");
    var h12 = h24 % 12; if (h12 === 0) h12 = 12;
    var ampm = h24 < 12 ? "AM" : "PM";

    var dayName = days[now.getDay()];
    var dayNum = now.getDate();
    var monthName = months[now.getMonth()];
    var year = now.getFullYear();
    var time = h12 + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()) + " " + ampm;

    greetEl.textContent = greeting + ". Today is " + dayName + ", " + dayNum + " " +
                          monthName + " " + year + ", " + time + ". Welcome to Shiv Shankar Gupta AI India.";
    dateEl.textContent = "The clock updates every second.";
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
